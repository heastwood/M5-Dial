# ha_mqtt_light.yaml
# ──────────────────────────────────────────────────────────────────────────────
# M5 Dial <-> Cync light bridge for Home Assistant
#
# SETUP
#   1. Replace every occurrence of  light.your_cync_bulb  with your actual
#      Cync entity ID (find it in HA > Settings > Devices & Services > Entities).
#   2. Paste the contents into your automations.yaml, or import each block
#      via the HA UI (Settings > Automations > + > Edit in YAML).
#   3. Reload automations: Developer Tools > YAML > All Automations.
#
# MQTT TOPICS (must match the values in src/config.h)
#   home/cync/set    dial -> HA   command (brightness, colour, on/off)
#   home/cync/state  HA  -> dial  state feedback, published with retain=true
#   home/cync/get    dial -> HA   empty boot-poll; triggers an immediate reply
# ──────────────────────────────────────────────────────────────────────────────

automation:

  # ── 1. Dial command -> Cync bulb ───────────────────────────────────────────
  # Receives {"state":"ON","brightness":200,"color":{"r":255,"g":147,"b":41}}
  # or        {"state":"OFF",...} and applies it to the Cync entity.
  # mode: queued so rapid dial spins don't race each other.
  - id: m5dial_cync_set
    alias: "M5 Dial -> Cync: apply brightness and colour"
    mode: queued
    max: 5
    trigger:
      - platform: mqtt
        topic: home/cync/set
    variables:
      payload: "{{ trigger.payload_json }}"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ payload.state | upper == 'OFF' }}"
            sequence:
              - action: light.turn_off
                target:
                  entity_id: light.your_cync_bulb
        default:
          - action: light.turn_on
            target:
              entity_id: light.your_cync_bulb
            data:
              brightness: "{{ payload.brightness | default(255) | int }}"
              rgb_color:
                - "{{ payload.color.r | default(255) | int }}"
                - "{{ payload.color.g | default(255) | int }}"
                - "{{ payload.color.b | default(255) | int }}"

  # ── 2. Cync state change -> dial display ───────────────────────────────────
  # Fires whenever the bulb changes from any source (HA dashboard, voice
  # assistant, another automation, etc.) and pushes the new state to the dial
  # so its display stays in sync.
  # mode: restart collapses rapid state churn into a single publish.
  - id: m5dial_cync_state_push
    alias: "Cync -> M5 Dial: push state on change"
    mode: restart
    trigger:
      - platform: state
        entity_id: light.your_cync_bulb
    action:
      - action: mqtt.publish
        data:
          topic: home/cync/state
          retain: true
          payload: >
            {
              "state": "{{ states('light.your_cync_bulb') | upper }}",
              "brightness": {{ state_attr('light.your_cync_bulb', 'brightness') | default(255) | int }},
              "color": {
                "r": {{ (state_attr('light.your_cync_bulb', 'rgb_color') or [255,255,255])[0] | int }},
                "g": {{ (state_attr('light.your_cync_bulb', 'rgb_color') or [255,255,255])[1] | int }},
                "b": {{ (state_attr('light.your_cync_bulb', 'rgb_color') or [255,255,255])[2] | int }}
              }
            }

  # ── 3. Dial boot poll -> immediate state reply ─────────────────────────────
  # On every power-on the dial publishes an empty message to home/cync/get
  # before it has any state.  This automation answers with the live bulb state
  # so the display is accurate from the moment it boots, regardless of whether
  # a retained message exists on the broker.
  - id: m5dial_cync_boot_poll
    alias: "M5 Dial boot poll -> reply with current Cync state"
    mode: queued
    max: 3
    trigger:
      - platform: mqtt
        topic: home/cync/get
    action:
      - action: mqtt.publish
        data:
          topic: home/cync/state
          retain: true
          payload: >
            {
              "state": "{{ states('light.your_cync_bulb') | upper }}",
              "brightness": {{ state_attr('light.your_cync_bulb', 'brightness') | default(255) | int }},
              "color": {
                "r": {{ (state_attr('light.your_cync_bulb', 'rgb_color') or [255,255,255])[0] | int }},
                "g": {{ (state_attr('light.your_cync_bulb', 'rgb_color') or [255,255,255])[1] | int }},
                "b": {{ (state_attr('light.your_cync_bulb', 'rgb_color') or [255,255,255])[2] | int }}
              }
            }
