# Add this to your Home Assistant configuration.yaml under `mqtt: light:`,
# or place it in a separate file included via !include_dir_list.
#
# This tells HA to expose your Cync bulb over MQTT so the M5 Dial can
# control it. The Cync integration must already be set up in HA so the
# entity `light.cync_bulb` (adjust the name below) exists.
#
# Automation that bridges the MQTT dial commands → Cync entity:

automation:
  - alias: "M5 Dial → Cync brightness & colour"
    trigger:
      - platform: mqtt
        topic: home/cync/set
    action:
      - variables:
          payload: "{{ trigger.payload_json }}"
      - service: light.turn_on
        target:
          entity_id: light.your_cync_bulb   # ← change to your entity_id
        data:
          brightness: "{{ payload.brightness | default(255) }}"
          rgb_color:
            - "{{ payload.color.r | default(255) }}"
            - "{{ payload.color.g | default(255) }}"
            - "{{ payload.color.b | default(255) }}"

  - alias: "Cync state → M5 Dial"
    trigger:
      - platform: state
        entity_id: light.your_cync_bulb     # ← same entity_id
    action:
      - service: mqtt.publish
        data:
          topic: home/cync/state
          retain: true
          payload: >
            {
              "state": "{{ states('light.your_cync_bulb') | upper }}",
              "brightness": {{ state_attr('light.your_cync_bulb','brightness') | default(255) | int }},
              "color": {
                "r": {{ (state_attr('light.your_cync_bulb','rgb_color') or [255,255,255])[0] }},
                "g": {{ (state_attr('light.your_cync_bulb','rgb_color') or [255,255,255])[1] }},
                "b": {{ (state_attr('light.your_cync_bulb','rgb_color') or [255,255,255])[2] }}
              }
            }
