# =============================================================================
# M5 Dial -> GE Cync Light Controller (via Home Assistant)
# Bulb: light.table_lamp_2
#
# Base hardware definitions are aligned to the canonical reference at
#   https://devices.esphome.io/devices/m5stack-dial/
# Custom additions on top:
#   - Rotary-encoder driven brightness ring on a round screen
#   - Tap-screen RGB color picker
#   - Debounced HA service calls + bulb -> dial brightness sync
# =============================================================================

substitutions:
  light_entity: light.left_nightstand_lamp

esphome:
  name: m5-dial-cync
  friendly_name: M5 Dial Cync
  min_version: 2024.6.0
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    then:
      - lambda: 'id(last_activity_ms) = millis();'

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - logger.log:
        format: "*** HA CLIENT CONNECTED: %s (%s) ***"
        args: ["client_info.c_str()", "client_address.c_str()"]
  on_client_disconnected:
    - logger.log: "*** HA CLIENT DISCONNECTED ***"

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "M5-Dial-Cync Fallback Hotspot"
    password: !secret wifi_ap_password

captive_portal:

# -----------------------------------------------------------------------------
# Buses (match the reference)
# -----------------------------------------------------------------------------
i2c:
  - id: internal_i2c
    sda: GPIO11
    scl: GPIO12
    scan: true

spi:
  id: spi_bus
  mosi_pin: GPIO5
  clk_pin: GPIO6

# -----------------------------------------------------------------------------
# Backlight (PWM) + monochromatic light to control it
# -----------------------------------------------------------------------------
output:
  - platform: ledc
    pin: GPIO9
    id: backlight_output

light:
  - platform: monochromatic
    name: "Backlight"
    output: backlight_output
    id: display_backlight
    default_transition_length: 0s
    restore_mode: ALWAYS_ON

# -----------------------------------------------------------------------------
# Screen dim after inactivity
# -----------------------------------------------------------------------------
interval:
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: 'return !id(screen_dimmed) && (millis() - id(last_activity_ms) >= 7000);'
          then:
            - lambda: 'id(screen_dimmed) = true;'
            - light.turn_off:
                id: display_backlight
                transition_length: 1s

# -----------------------------------------------------------------------------
# State for the UI
# -----------------------------------------------------------------------------
globals:
  - id: ui_mode               # 0 = brightness, 1 = color picker
    type: int
    initial_value: '0'
    restore_value: no
  - id: last_encoder_ms       # millis() at last encoder tick (for velocity)
    type: uint32_t
    initial_value: '0'
    restore_value: no
  - id: brightness_val        # 0-100
    type: int
    initial_value: '50'
    restore_value: yes
  - id: red_val               # 0-255
    type: int
    initial_value: '255'
    restore_value: yes
  - id: green_val
    type: int
    initial_value: '255'
    restore_value: yes
  - id: blue_val
    type: int
    initial_value: '255'
    restore_value: yes
  - id: selected_channel      # 0=R, 1=G, 2=B
    type: int
    initial_value: '0'
    restore_value: no
  - id: touch_handled
    type: bool
    initial_value: 'false'
    restore_value: no
  - id: last_activity_ms      # millis() at last user interaction (for screen dim)
    type: uint32_t
    initial_value: '0'
    restore_value: no
  - id: screen_dimmed         # true while backlight is off due to inactivity
    type: bool
    initial_value: 'false'
    restore_value: no

# -----------------------------------------------------------------------------
# Fonts & colors
# -----------------------------------------------------------------------------
font:
  - file: "gfonts://Roboto"
    id: font_xl
    size: 64
  - file: "gfonts://Roboto"
    id: font_md
    size: 22
  - file: "gfonts://Roboto"
    id: font_sm
    size: 15

color:
  - id: c_white
    red: 100%
    green: 100%
    blue: 100%
  - id: c_gray
    red: 55%
    green: 55%
    blue: 60%
  - id: c_dim
    red: 25%
    green: 25%
    blue: 30%

# -----------------------------------------------------------------------------
# Display: GC9A01A 240x240 round panel (matches reference pinout)
# -----------------------------------------------------------------------------
display:
  - platform: ili9xxx
    id: round_display
    model: GC9A01A
    cs_pin: GPIO7
    reset_pin: GPIO8
    dc_pin: GPIO4
    invert_colors: true
    update_interval: 200ms
    lambda: |-
      it.fill(Color::BLACK);
      const int cx = 120, cy = 120;

      if (!id(lamp_state_ha).state) {
        // ================ OFF SCREEN ================
        const int outer_r = 116;
        const int inner_r = 104;
        // Dim background ring only
        for (int a = 0; a < 360; a += 6) {
          float rad = (a - 90) * M_PI / 180.0f;
          int x1 = cx + cosf(rad) * inner_r;
          int y1 = cy + sinf(rad) * inner_r;
          int x2 = cx + cosf(rad) * outer_r;
          int y2 = cy + sinf(rad) * outer_r;
          it.line(x1, y1, x2, y2, Color(30, 30, 38));
        }
        it.print(cx, cy - 10, id(font_xl), id(c_dim),
                 TextAlign::CENTER, "OFF");
        it.print(cx, cy + 40, id(font_sm), id(c_dim),
                 TextAlign::CENTER, "press to turn on");

      } else if (id(ui_mode) == 0) {
        // ================ BRIGHTNESS SCREEN ================
        const int outer_r = 116;
        const int inner_r = 104;
        const float deg_max = (id(brightness_val) / 100.0f) * 360.0f;

        // Background ring (coarse stepping to keep CPU happy)
        for (int a = 0; a < 360; a += 6) {
          float rad = (a - 90) * M_PI / 180.0f;
          int x1 = cx + cosf(rad) * inner_r;
          int y1 = cy + sinf(rad) * inner_r;
          int x2 = cx + cosf(rad) * outer_r;
          int y2 = cy + sinf(rad) * outer_r;
          it.line(x1, y1, x2, y2, Color(35, 35, 45));
        }
        // Foreground ring tinted by current RGB
        Color ring(
          (uint8_t)(id(red_val)   * 0.6f + 80),
          (uint8_t)(id(green_val) * 0.6f + 80),
          (uint8_t)(id(blue_val)  * 0.6f + 80));
        for (int a = 0; a < (int)deg_max; a += 3) {
          float rad = (a - 90) * M_PI / 180.0f;
          int x1 = cx + cosf(rad) * inner_r;
          int y1 = cy + sinf(rad) * inner_r;
          int x2 = cx + cosf(rad) * outer_r;
          int y2 = cy + sinf(rad) * outer_r;
          it.line(x1, y1, x2, y2, ring);
        }

        // Big percent number
        it.printf(cx, cy - 10, id(font_xl), id(c_white),
                  TextAlign::CENTER, "%d", id(brightness_val));
        it.print(cx + 52, cy - 10, id(font_md), id(c_gray),
                 TextAlign::CENTER, "%");

        it.print(cx, cy + 38, id(font_sm), id(c_gray),
                 TextAlign::CENTER, "BRIGHTNESS");

        // Live color swatch
        Color current(id(red_val), id(green_val), id(blue_val));
        it.filled_circle(cx, cy + 68, 9, current);
        it.circle(cx, cy + 68, 9, id(c_dim));

        it.print(cx, cy + 92, id(font_sm), id(c_dim),
                 TextAlign::CENTER, "tap for color");

      } else {
        // ================ COLOR PICKER ================
        struct Row { const char* label; int val; int y; uint8_t r,g,b; int sel; };
        Row rows[3] = {
          {"R", id(red_val),   62,  255, 70,  70,  0},
          {"G", id(green_val), 112, 70,  255, 70,  1},
          {"B", id(blue_val),  162, 80,  120, 255, 2},
        };

        for (auto &row : rows) {
          bool selected = (id(selected_channel) == row.sel);
          Color bg = selected
            ? Color(row.r/4 + 30, row.g/4 + 30, row.b/4 + 30)
            : Color(15, 15, 20);
          it.filled_rectangle(20, row.y - 22, 200, 44, bg);
          if (selected) {
            it.rectangle(20, row.y - 22, 200, 44, Color(row.r, row.g, row.b));
          }
          it.printf(34, row.y, id(font_md), id(c_white),
                    TextAlign::CENTER_LEFT, "%s", row.label);
          it.printf(206, row.y, id(font_md), id(c_white),
                    TextAlign::CENTER_RIGHT, "%d", row.val);

          int bar_w = (row.val * 150) / 255;
          it.filled_rectangle(55, row.y + 10, 150, 4, Color(40, 40, 50));
          it.filled_rectangle(55, row.y + 10, bar_w, 4,
                              Color(row.r, row.g, row.b));
        }

        // Apply swatch
        Color preview(id(red_val), id(green_val), id(blue_val));
        it.filled_circle(cx, 210, 16, preview);
        it.circle(cx, 210, 16, id(c_white));
        it.print(cx, 233, id(font_sm), id(c_gray),
                 TextAlign::CENTER, "APPLY");
      }

# -----------------------------------------------------------------------------
# Touchscreen: FT3267 -> ft5x06 platform at 0x38 (reference uses this)
# The component does not support interrupt_pin on this platform.
# -----------------------------------------------------------------------------
touchscreen:
  - platform: ft5x06
    id: touch
    i2c_id: internal_i2c
    address: 0x38
    on_touch:
      - lambda: |-
          // Wake screen on any touch
          if (id(screen_dimmed)) {
            id(screen_dimmed) = false;
            auto call = id(display_backlight).turn_on();
            call.set_brightness(1.0f);
            call.set_transition_length(0);
            call.perform();
          }
          id(last_activity_ms) = millis();

          if (id(touch_handled)) return;
          id(touch_handled) = true;

          int x = touch.x;
          int y = touch.y;

          if (id(ui_mode) == 0) {
            // Only open color picker if the lamp is actually on
            if (id(lamp_state_ha).state) {
              id(ui_mode) = 1;
            }
            return;
          }

          // Tap APPLY swatch -> send color and go back
          int dx = x - 120;
          int dy = y - 210;
          if (dx * dx + dy * dy < 28 * 28) {
            id(send_color_update).execute();
            id(ui_mode) = 0;
          } else if (y < 90) {
            id(selected_channel) = 0;
          } else if (y < 140) {
            id(selected_channel) = 1;
          } else if (y < 190) {
            id(selected_channel) = 2;
          }
    on_release:
      - lambda: 'id(touch_handled) = false;'

# -----------------------------------------------------------------------------
# Rotary encoder on GPIO40/41 (reference pinout)
# -----------------------------------------------------------------------------
sensor:
  - platform: rotary_encoder
    id: encoder
    name: "Encoder"
    pin_a:
      number: GPIO40
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO41
      mode:
        input: true
        pullup: true
    resolution: 1
    on_clockwise:
      - lambda: |-
          // Wake screen on any interaction
          if (id(screen_dimmed)) {
            id(screen_dimmed) = false;
            auto call = id(display_backlight).turn_on();
            call.set_brightness(1.0f);
            call.set_transition_length(0);
            call.perform();
          }
          id(last_activity_ms) = millis();

          // Debounce: ignore ticks faster than 20ms (mechanical bounce)
          uint32_t now = millis();
          uint32_t delta = now - id(last_encoder_ms);
          if (delta < 20) return;
          id(last_encoder_ms) = now;

          if (id(ui_mode) == 0 || !id(lamp_state_ha).state) {
            // Brightness mode (or lamp off -> rotating wakes it)
            int step = (delta < 80) ? 10 : (delta < 200) ? 5 : 2;
            id(brightness_val) = std::min(100, id(brightness_val) + step);
            ESP_LOGD("encoder", "CW bri=%d step=%d delta=%dms",
                     id(brightness_val), step, (int)delta);
            id(send_brightness_update).execute();
          } else {
            // Color picker mode
            int step = (delta < 80) ? 25 : (delta < 200) ? 15 : 5;
            int *t = (id(selected_channel) == 0) ? &id(red_val)
                   : (id(selected_channel) == 1) ? &id(green_val)
                                                 : &id(blue_val);
            *t = std::min(255, *t + step);
            ESP_LOGD("encoder", "CW color ch=%d val=%d step=%d",
                     id(selected_channel), *t, step);
          }
    on_anticlockwise:
      - lambda: |-
          // Wake screen on any interaction
          if (id(screen_dimmed)) {
            id(screen_dimmed) = false;
            auto call = id(display_backlight).turn_on();
            call.set_brightness(1.0f);
            call.set_transition_length(0);
            call.perform();
          }
          id(last_activity_ms) = millis();

          // Debounce: ignore ticks faster than 20ms (mechanical bounce)
          uint32_t now = millis();
          uint32_t delta = now - id(last_encoder_ms);
          if (delta < 20) return;
          id(last_encoder_ms) = now;

          if (id(ui_mode) == 0 || !id(lamp_state_ha).state) {
            int step = (delta < 80) ? 10 : (delta < 200) ? 5 : 2;
            id(brightness_val) = std::max(0, id(brightness_val) - step);
            ESP_LOGD("encoder", "CCW bri=%d step=%d delta=%dms",
                     id(brightness_val), step, (int)delta);
            id(send_brightness_update).execute();
          } else {
            int step = (delta < 80) ? 25 : (delta < 200) ? 15 : 5;
            int *t = (id(selected_channel) == 0) ? &id(red_val)
                   : (id(selected_channel) == 1) ? &id(green_val)
                                                 : &id(blue_val);
            *t = std::max(0, *t - step);
            ESP_LOGD("encoder", "CCW color ch=%d val=%d step=%d",
                     id(selected_channel), *t, step);
          }

  # Sync dial when bulb is changed from Cync app / voice assistant.
  - platform: homeassistant
    id: ha_bulb_brightness
    entity_id: ${light_entity}
    attribute: brightness
    on_value:
      - lambda: |-
          if (!isnan(x)) {
            id(brightness_val) = (int)((x / 255.0f) * 100.0f);
          }

# -----------------------------------------------------------------------------
# Buttons (GPIO42 front, GPIO46 side - both match reference)
# + HA lamp state sensor (drives off screen / on screen)
# -----------------------------------------------------------------------------
binary_sensor:
  - platform: status
    name: "Status"

  - platform: homeassistant
    id: lamp_state_ha
    entity_id: ${light_entity}
    on_state:
      # Reset to brightness screen when lamp turns off from any source.
      - lambda: |-
          if (!x) id(ui_mode) = 0;

  - platform: gpio
    name: Button
    id: front_button
    pin:
      number: GPIO42
      mode:
        input: true
        pullup: true
      inverted: true
    on_click:
      min_length: 30ms
      max_length: 600ms
      then:
        - if:
            condition:
              lambda: 'return id(screen_dimmed);'
            then:
              - lambda: 'id(screen_dimmed) = false;'
              - light.turn_on:
                  id: display_backlight
                  brightness: 100%
                  transition_length: 0s
        - lambda: 'id(last_activity_ms) = millis();'
        - if:
            condition:
              lambda: 'return id(ui_mode) == 1;'
            then:
              # In color picker: apply color and return to brightness screen
              - script.execute: send_color_update
              - lambda: 'id(ui_mode) = 0;'
            else:
              # Brightness / off screen: explicitly turn on or off
              - if:
                  condition:
                    lambda: 'return id(lamp_state_ha).state;'
                  then:
                    - homeassistant.action:
                        action: light.turn_off
                        data:
                          entity_id: ${light_entity}
                  else:
                    - homeassistant.action:
                        action: light.turn_on
                        data:
                          entity_id: ${light_entity}

  - platform: gpio
    name: Hold Button
    id: hold_button
    pin: GPIO46

# -----------------------------------------------------------------------------
# Debounced senders -> Home Assistant
# mode: restart -> only the last value after a scrub is sent
# -----------------------------------------------------------------------------
script:
  - id: send_brightness_update
    mode: restart
    then:
      - delay: 150ms
      - logger.log:
          level: DEBUG
          format: "Sending brightness=%d/255 (%d%%) to %s"
          args: [ '(int)((id(brightness_val) / 100.0f) * 255.0f)', 'id(brightness_val)', '"${light_entity}"' ]
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: ${light_entity}
          variables:
            bri_255: |-
              return (int)((id(brightness_val) / 100.0f) * 255.0f);
          data_template:
            brightness: "{{ bri_255 }}"

  - id: send_color_update
    mode: restart
    then:
      - delay: 100ms
      - logger.log:
          level: DEBUG
          format: "Sending rgb=[%d,%d,%d] to %s"
          args: [ 'id(red_val)', 'id(green_val)', 'id(blue_val)', '"${light_entity}"' ]
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: ${light_entity}
          variables:
            r_val: 'return id(red_val);'
            g_val: 'return id(green_val);'
            b_val: 'return id(blue_val);'
          data_template:
            rgb_color: "[{{ r_val }}, {{ g_val }}, {{ b_val }}]"
